<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>XuSearch</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <section class="popup-panel">
        <section class="search-composer" aria-label="搜索输入区">
          <div class="composer-input-row">
            
            <button
              id="historyToggleBtn"
              class="composer-history-toggle"
              type="button"
              hidden
              aria-expanded="false"
              aria-label="搜索历史"
              data-i18n-attr="aria-label:popup_historyToggleAria"
            >
              <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
            <textarea
              id="popupQueryInput"
              class="popup-query-input"
              rows="1"
              placeholder="从虚空中探索万物"
              data-i18n-attr="placeholder:popup_queryPlaceholder"
            ></textarea>
          </div>

          <div id="historyPanel" class="composer-history-panel">
            <div class="composer-history-head">
              
              <button
                id="historyCollapseBtn"
                class="composer-history-arrow"
                type="button"
                aria-expanded="true"
                aria-label="搜索历史"
                data-i18n-attr="aria-label:popup_historyToggleAria"
              >
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                  <path d="M6 15l6-6 6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>
            </div>
            <div id="historyList" class="composer-history-list"></div>
          </div>

          <div class="composer-resize-handle" title="拖动调整输入区高度" aria-hidden="true"></div>

          <div class="composer-actions-row">
            
            <button id="promptEntryBtn" class="composer-icon-btn" type="button" aria-label="提示词入口" aria-expanded="false" data-i18n-attr="aria-label:popup_promptEntryAria">
              <span class="sparkle-icon" aria-hidden="true">

                </svg>
              </span>
            </button>
          </div>

        </section>

        <div class="groups-area">
          <div id="popupGroups" class="popup-groups"></div>
        </div>

        
        <div id="promptPicker" class="popup-prompt-picker" hidden></div>
      </section>

      <div class="popup-footer">
        <span class="popup-footer-kbd">Space × 2</span>
        <span class="popup-footer-hint" data-i18n="popup_footerSpaceHint">双击空格后可通过数字快速选组</span>
        <span class="popup-footer-spacer"></span>
        <button
          id="openSettingsBtn"
          class="popup-footer-gear"
          type="button"
          data-i18n-attr="aria-label:popup_settings;title:popup_settings"
        >
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

          </svg>
        </button>
      </div>
    </main>
    <script src="../shared/i18n.js"></script>
    <script src="../shared/prompt-item.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
