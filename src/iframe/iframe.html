<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title data-i18n="iframe_pageTitle">XuSearch - 虚空搜索</title>
    <link rel="stylesheet" href="iframe.css" />
  </head>
  <body>
    <div class="app-shell">
      <section class="cards-panel">
        <div id="iframes-container" class="iframes-container" data-columns="1"></div>
      </section>

      <aside id="siteNavPanel" class="site-nav-panel" hidden>
        <div class="site-nav-header" data-i18n="iframe_siteNavTitle">AI 模型</div>
        <div id="siteNavList" class="site-nav-list"></div>
      </aside>

      
      <div id="historyPanel" class="export-modal history-modal" role="dialog" aria-modal="true" aria-label="搜索与提问记录" hidden>
        <div class="export-modal-content history-modal-content">
          <div class="export-modal-header">
            <h3 class="export-modal-title" data-i18n="iframe_historyTitle">搜索与提问记录</h3>
            <button id="closeHistoryPanelBtn" class="export-close-btn" type="button" data-i18n-attr="aria-label:iframe_close" aria-label="关闭"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button>
          </div>
          <div class="export-notice" data-i18n="iframe_historyNotice">点击「复原」可新开页面恢复这次搜索会话；删除后不可恢复。点击条目卡片可查看该次搜索的站点。</div>
          <div class="history-modal-body">
            
            <div class="history-filter-row">
              <div id="historyFilterBar" class="history-filter-bar" role="tablist" aria-label="搜索记录筛选">
                <button id="historyFilterAllBtn" class="history-filter-btn is-active" type="button" role="tab" aria-selected="true" data-history-filter="all" data-i18n="iframe_historyFilterAll">全部</button>
                <button id="historyFilterYesterdayBtn" class="history-filter-btn" type="button" role="tab" aria-selected="false" data-history-filter="yesterday" data-i18n="iframe_historyFilterYesterday">昨天</button>
                <button id="historyFilterBeforeYesterdayBtn" class="history-filter-btn" type="button" role="tab" aria-selected="false" data-history-filter="before-yesterday" data-i18n="iframe_historyFilterBeforeYesterday">前天</button>
              </div>
              <div class="history-search">
                <svg class="history-search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/></svg>
                <input id="historySearchInput" class="history-search-input" type="search" autocomplete="off" spellcheck="false" placeholder="搜索历史记录" data-i18n-attr="placeholder:iframe_historySearchPlaceholder;aria-label:iframe_historySearchPlaceholder" aria-label="搜索历史记录">
              </div>
            </div>
            <div id="historyList" class="history-list"></div>
          </div>
          <div class="export-actions history-modal-footer">
            <button id="clearHistoryBtn" class="export-cancel-btn" type="button" data-i18n="iframe_historyClear">清空记录</button>
            <button id="closeHistoryFooterBtn" class="export-confirm-btn" type="button" data-i18n="iframe_close">关闭</button>
          </div>
        </div>
      </div>

      <section class="bottom-composer">
        <span id="globalStatus" class="global-status visually-hidden" data-i18n="iframe_loadingStatus">正在加载站点配置...</span>

        <div id="cardNavRow" class="card-nav-row">
          <button id="cardNavScrollLeftBtn" class="card-nav-scroll-btn" type="button" data-tooltip="向左滚动标签" data-i18n-attr="aria-label:iframe_cardNavScrollLeft;data-tooltip:iframe_cardNavScrollLeft" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <div id="cardNavStrip" class="card-nav-strip"></div>
          <button id="cardNavScrollRightBtn" class="card-nav-scroll-btn" type="button" data-tooltip="向右滚动标签" data-i18n-attr="aria-label:iframe_cardNavScrollRight;data-tooltip:iframe_cardNavScrollRight" hidden>
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>

        <div id="hScrollStrip" class="h-scroll-strip" hidden>
          <div id="hScrollThumb" class="h-scroll-thumb"></div>
        </div>

        <div class="bottom-composer-row">
        <div class="bottom-composer-bar">
          <div class="composer-input-shell">
            
            <div id="promptPicker" class="composer-prompt-picker" hidden></div>
            <div class="composer-input-row">
              
              <textarea
                id="queryInput"
                class="bottom-query-input"
                placeholder="输入问题，或拖拽/粘贴文件以批量上传到所有站点"
                data-i18n-attr="placeholder:iframe_queryPlaceholder"
                rows="1"
              ></textarea>
            </div>

            <div class="composer-toolbar-row">
              

              <div class="composer-inline-actions">
                <button id="aiSummaryBtn" class="composer-inline-icon composer-tooltip-btn" type="button" data-tooltip="AI总结" data-i18n-attr="aria-label:iframe_aiSummaryTooltip;data-tooltip:iframe_aiSummaryTooltip">

                </button>

                    </svg>
                  </button>
                </div>

                <button id="sendSelectedBtn" class="composer-inline-icon composer-inline-icon-send is-empty" type="button" data-i18n-attr="aria-label:iframe_send">

                  </svg>
                </button>
              </div>
            </div>
          </div>
        </div>

        </div>
        
              <div id="bottomCornerActions" class="bottom-corner-actions">

                  <div class="layout-menu-wrap">
                    <button id="layoutToggleBtn" class="corner-action composer-tooltip-btn" type="button" data-tooltip="布局调整" data-i18n-attr="aria-label:iframe_layoutSettings;data-tooltip:iframe_layoutSettings">

                      </div>
                    </div>
                  </div>
